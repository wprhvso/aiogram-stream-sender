[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiogram-stream-sender"
version = "0.1.0"
description = "Incremental delivery of streamed text into Telegram messages"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "aiogram>=3.22",
]

[project.urls]
Repository = "https://github.com/wprhvso/aiogram-stream-sender"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiogram_stream_sender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/aiogram_stream_sender"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
